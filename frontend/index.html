<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TaskFlow — A sleek, modern task management application." />
  <title>TaskFlow — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ── Animated background blobs ── -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <!-- ── Header ── -->
    <header class="app-header" id="app-header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <h1>TaskFlow</h1>
        </div>
        <div class="header-stats">
          <div class="stat" id="stat-total">
            <span class="stat-value">0</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat" id="stat-done">
            <span class="stat-value">0</span>
            <span class="stat-label">Done</span>
          </div>
          <div class="stat" id="stat-pending">
            <span class="stat-value">0</span>
            <span class="stat-label">Pending</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ── Main content ── -->
    <main class="main-content">
      <!-- ── Add task form ── -->
      <section class="add-task-section" id="add-task-section">
        <form id="add-task-form" class="add-task-form">
          <div class="form-row">
            <input
              type="text"
              id="task-title"
              class="input-title"
              placeholder="What needs to be done?"
              required
              autocomplete="off"
            />
            <button type="submit" class="btn-add" id="btn-add-task">
              <span class="btn-icon">+</span>
              <span class="btn-text">Add</span>
            </button>
          </div>
          <div class="form-row form-row-secondary">
            <input
              type="text"
              id="task-description"
              class="input-desc"
              placeholder="Description (optional)"
              autocomplete="off"
            />
            <div class="priority-selector" id="priority-selector">
              <button type="button" class="priority-btn" data-priority="low" title="Low priority">
                <span class="priority-dot"></span> Low
              </button>
              <button type="button" class="priority-btn active" data-priority="medium" title="Medium priority">
                <span class="priority-dot"></span> Med
              </button>
              <button type="button" class="priority-btn" data-priority="high" title="High priority">
                <span class="priority-dot"></span> High
              </button>
            </div>
          </div>
        </form>
      </section>

      <!-- ── Filter bar ── -->
      <section class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="all" id="filter-all">All</button>
        <button class="filter-btn" data-filter="pending" id="filter-pending">Pending</button>
        <button class="filter-btn" data-filter="completed" id="filter-completed">Completed</button>
      </section>

      <!-- ── Task list ── -->
      <section class="task-list-section">
        <ul class="task-list" id="task-list">
          <!-- Tasks rendered by JS -->
        </ul>
        <div class="empty-state" id="empty-state" style="display: none;">
          <span class="empty-icon">📋</span>
          <p>No tasks yet. Add one above!</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>TaskFlow &middot; Built with Express &amp; Vanilla JS</p>
    </footer>
  </div>

  <!-- ── Edit modal ── -->
  <div class="modal-overlay" id="edit-modal" style="display:none;">
    <div class="modal" role="dialog" aria-labelledby="modal-title">
      <h2 id="modal-title">Edit Task</h2>
      <form id="edit-task-form">
        <input type="hidden" id="edit-task-id" />
        <label for="edit-title">Title</label>
        <input type="text" id="edit-title" class="modal-input" required />
        <label for="edit-description">Description</label>
        <textarea id="edit-description" class="modal-input modal-textarea"></textarea>
        <label>Priority</label>
        <div class="priority-selector modal-priority" id="edit-priority-selector">
          <button type="button" class="priority-btn" data-priority="low"><span class="priority-dot"></span> Low</button>
          <button type="button" class="priority-btn" data-priority="medium"><span class="priority-dot"></span> Med</button>
          <button type="button" class="priority-btn" data-priority="high"><span class="priority-dot"></span> High</button>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="btn-cancel-edit">Cancel</button>
          <button type="submit" class="btn-save" id="btn-save-edit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
